# herd configuration - copy to barn.toml and fill in. Values not set here
# take the defaults in common.py (DEFAULTS).

[farm]
timezone_offset_hours = 2       # farm local time vs UTC: days, nights and Tuesday follow it
migration_weekday = 1           # 0 = Monday: cows change on Tuesday ...
migration_hour = 10             # ... at 10:00
nightly_hour = 2                # gallery maintenance: retire, rebuild prototypes, enroll new cows

[sampling]
fps = 1.0                       # posture / activity once a second, every camera
burst_every_s = 60              # a 7 s burst per camera every minute (staggered between cameras)
burst_seconds = 7.0
burst_fps = 25.0
burst_detect_fps = 5.0          # detector runs on 5 of the 25 frames a second; boxes are interpolated
frame_width = 1920              # Full HD kept as it comes (wider frames are scaled to it); ~1.5 GB
                                # of RAM per camera for its 10 s ring buffer at 25 fps

[model]
checkpoint = "/workspace/herd/run1/model.pt"     # abstain.json next to it is picked up
# rumination = "/workspace/rum/model/rumination.pt"  # rumination.py's model (Kaggle + CVB): decides
#                                                  # rumination in place of the herd model's head

[detector]
weights = "/workspace/lora-runs/detector/best"   # RT-DETRv2 (cowbench/detector.py)
# threshold = 0.4                                # default: the one chosen at training;
#                                                  herd.py eval-det prints the one with the lowest error
# tiles = true                                   # whole frame + square tiles: far cows ~1.8x wider, ~3x
#                                                  the detector's work; default: as it was trained

[zone]                          # where cameras work at all - far cows are not tried
min_box_pct = 0.0               # boxes smaller than this % of the frame are dropped before tracking:
                                # no posture, no identity, no NaN for them (0.6 = 0.6% of the frame)
min_box_side_px = 0             # and/or: the box's short side in pixels of the kept frame (frame_width)
                                # herd.py eval-det prints a sweep and a suggested value for each
blank_excluded = true           # grey out each camera's `exclude` polygons before the detector
                                # (per camera, any of these three can be set again to override)

[tracker]
iou = 0.3
max_age_s = 5

[identity]
prototypes_per_cow = 6          # k-means centres per cow
history_days = 7                # prototypes from the last week of confirmed bursts
max_error = 0.01                # the NaN cut-off is tuned for this error among answers (abstain.py)
new_cow_similarity = 0.55       # bursts this similar are one cow when grouping unknowns;
                                # start from same_cow_sim_p05 in abstain.json
new_cow_min_bursts = 20         # a group needs this many bursts to become a new cow
retire_after_hours = 48         # after a change-over, cows not seen this long have left
max_cows = 0                    # the herd's size (e.g. 60); at it no new ids are made, unknowns wait
claim_s = 120                   # a confirmed cow belongs to her track this long: a track seen at the
claim_steal_margin = 0.08       # same time cannot be her unless its burst is this much surer

[lameness]
enabled = false                 # no lameness labels yet: the head exists, its output is not used
# alert_score = 3.0

[alerts]
baseline_days = 7               # each cow against her own previous week
min_baseline_days = 3
min_observed_minutes = 120      # a day the cow was barely seen is not compared
mad_z = 3.0                     # how unusual, in her own spread (MAD)
rumination_drop = 0.20          # and at least this much lower than her median
lying_directions = ["low", "high"]   # which way is "worse" is open: both are flagged
lying_change = 0.20

[report]
period_days = 3

[store]
path = "/workspace/herd/barn/herd.sqlite"   # gallery/ and names.json live next to it

[training_cache]                # the barn's bursts as identity training data (barn_dataset.py)
enabled = false                 # true: keep every_n-th burst's frame vectors + a thumbnail
every_n = 10                    # 60 cows, a burst a minute each: ~360 of ~3600 bursts an hour, ~250 MB an hour
max_gb = 200                    # stop keeping when the folder reaches this
folder = "training_cache"       # next to the store unless absolute

[mct]                           # one track per cow across cameras (mct.py); a cow's frame id is the
enabled = false                 # herd model's transformer on one frame (herd/mct_pod.sh: thresholds)
neighbours = []                 # camera pairs with a band of shared floor: [["cam1", "cam2"], ["cam2", "cam3"]]
disjoint = []                   # pairs that share no floor at all: cows seen by both at once are two cows
handover_s = 2.5                # a neighbour's cow seen this recently may be passed on
handover_min_sim = 0.5          # frame id vs the track's running average, and at least
handover_margin = 0.05          # this much above the next candidate (else a new track)
reacquire_s = 10.0              # a cow hidden this long is taken back near where she was ...
reacquire_sim = 0.7             # ... if her frame id is this close
# a blind passage between two cameras: a cow lost by `from` min_s..max_s ago may come out in `to`
# [[mct.portals]]
# from = "cam2"
# to = "cam5"
# min_s = 5
# max_s = 60
# exit = [[0.8, 0.0], [1.0, 0.0], [1.0, 1.0], [0.8, 1.0]]   # optional: where she leaves `from`
# entry = [[0.0, 0.0], [0.2, 0.0], [0.2, 1.0], [0.0, 1.0]]  # optional: where she enters `to`

# One block per camera. The cameras look down and partly overlap: draw each
# mask (0-1 frame coordinates, one polygon or a list of them) over the floor
# that camera alone owns, so every patch of floor is in exactly one mask.
[[cameras]]
id = "cam1"
url = "rtsp://user:password@10.0.0.11:554/stream1"
mask = [[0.0, 0.0], [0.55, 0.0], [0.55, 1.0], [0.0, 1.0]]
# with [mct] enabled: where it follows cows, reaching into the neighbour's floor (default: mask);
# cows are still counted only in mask. handover_zone (optional): where a neighbour's cow may come in
# tracking_mask = [[0.0, 0.0], [0.75, 0.0], [0.75, 1.0], [0.0, 1.0]]
# handover_zone = [[0.45, 0.0], [0.75, 0.0], [0.75, 1.0], [0.45, 1.0]]
# optional: a part of the view to grey out before the detector (one polygon or a list),
# for what the size cut does not catch - e.g. a neighbour's pen behind a rail
# exclude = [[0.0, 0.0], [1.0, 0.0], [1.0, 0.15], [0.0, 0.15]]
# min_box_pct = 0.4              # this camera's own size cut, if it differs

[[cameras]]
id = "cam2"
url = "rtsp://user:password@10.0.0.12:554/stream1"
mask = [[0.05, 0.0], [1.0, 0.0], [1.0, 1.0], [0.05, 1.0]]

# [[cameras]]  cam3, cam4, cam5 the same way
